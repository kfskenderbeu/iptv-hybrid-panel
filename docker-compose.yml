version: '3.8'

services:
  # IPTV Panel Server
  iptv-panel:
    build: .
    container_name: iptv-hybrid-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - P2P_ENABLED=true
      - MAX_PEERS=50
      - HIDDEN_LAYER_ENABLED=true
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - iptv-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis për caching (optional)
  redis:
    image: redis:7-alpine
    container_name: iptv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - iptv-network
    command: redis-server --appendonly yes

  # MongoDB për storage (optional)
  mongodb:
    image: mongo:7
    container_name: iptv-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=iptv_secure_password
      - MONGO_INITDB_DATABASE=iptv_panel
    volumes:
      - mongodb-data:/data/db
    networks:
      - iptv-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: iptv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - iptv-panel
    networks:
      - iptv-network

networks:
  iptv-network:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
